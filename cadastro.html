<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Instituto Recomeçar</title>

    <!-- Conecta o CSS do projeto -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>Instituto Recomeçar</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="quemsomos.html">Quem somos</a>
            <a href="projetos.html">Projetos</a>
            <a href="comoajudar.html">Como ajudar</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>

    </header>

    <main>

        <section>

            <h2>Cadastro</h2>

            <p>
                Preencha seus dados para participar das ações
                e projetos do Instituto Recomeçar.
            </p>

            <form method="post">

                <fieldset>

                    <legend>Dados Pessoais</legend>

                    <label for="nome">
                        Nome completo:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        required
                    >

                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                    <label for="data">
                        Data de nascimento:
                    </label>

                    <input
                        type="date"
                        id="data"
                        name="data"
                        autocomplete="bday"
                        required
                    >

                    <label for="cpf">
                        CPF:
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        required
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        placeholder="000.000.000-00"
                    >

                    <label for="telefone">
                        Telefone:
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                        pattern="[0-9]{10,11}"
                        placeholder="11999999999"
                    >

                </fieldset>

                <fieldset>

                    <legend>Endereço</legend>

                    <label for="endereco">
                        Endereço:
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        autocomplete="street-address"
                        required
                    >

                    <label for="cep">
                        CEP:
                    </label>

                    <input
                        type="text"
                        id="cep"
                        name="cep"
                        required
                        pattern="[0-9]{5}-[0-9]{3}"
                        placeholder="00000-000"
                    >

                    <label for="cidade">
                        Cidade:
                    </label>

                    <input
                        type="text"
                        id="cidade"
                        name="cidade"
                        autocomplete="address-level2"
                        required
                    >

                    <label for="estado">
                        Estado:
                    </label>

                    <select
                        id="estado"
                        name="estado"
                        autocomplete="address-level1"
                        required
                    >

                        <option value="">
                            Selecione seu estado
                        </option>

                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>

                    </select>

                </fieldset>

                <fieldset>

                    <legend>Interesse em voluntariado</legend>

                    <label for="interesse">
                        Área de interesse:
                    </label>

                    <select
                        id="interesse"
                        name="interesse"
                        required
                    >

                        <option value="">
                            Selecione uma área
                        </option>

                        <option value="educ">
                            Educação
                        </option>

                        <option value="assis">
                            Assistência social
                        </option>

                        <option value="even">
                            Eventos
                        </option>

                        <option value="arrec">
                            Arrecadação de doações
                        </option>

                    </select>

                </fieldset>

                <fieldset>

                    <legend>Mensagem</legend>

                    <label for="texto">
                        Conte-nos como gostaria de contribuir:
                    </label>

                    <textarea
                        id="texto"
                        name="texto"
                        rows="5"
                        required
                        placeholder="Escreva aqui..."
                    ></textarea>

                </fieldset>

                <input
                    type="submit"
                    value="Enviar cadastro"
                >

            </form>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 Instituto Recomeçar.
            Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
